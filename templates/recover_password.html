{% extends "base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <h1>Recuperar contraseña</h1>
  <p class="lead">Escribe el correo de tu usuario y te enviaremos un enlace para crear una contraseña nueva.</p>
  <div class="card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" required></div>
      <button class="btn btn-primary" type="submit">Enviar enlace</button>
      <a class="btn" href="{{ url_for('login') }}">Volver</a>
    </form>
  </div>
</div>
{% endblock %}
