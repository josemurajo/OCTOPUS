{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
  <div style="text-align:center; margin-bottom: 24px;">
    <div class="brand-logo" style="width:52px;height:52px;font-size:24px;margin:0 auto 12px;border-radius:14px;">O</div>
    <h1>OCTOPUS</h1>
    <p class="muted">Copias de seguridad de tus equipos</p>
  </div>
  <div class="card">
    <form method="post" action="{{ url_for('login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-big" type="submit" style="width:100%; justify-content:center;">Entrar</button>
    </form>
    <p class="small muted" style="margin-top:16px; text-align:center;">
      <a href="{{ url_for('recover_password') }}">¿Has olvidado la contraseña?</a>
    </p>
  </div>
  <p class="small muted" style="text-align:center;">La primera vez la contraseña está en el archivo <strong>CREDENCIALES_INICIALES.txt</strong>.</p>
</div>
{% endblock %}
