{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <h1>Nueva contraseña</h1>
  <p class="lead">Elige una contraseña de al menos 12 caracteres. Una frase larga es más fácil de recordar y más segura.</p>
  <div class="card">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="password">Contraseña nueva</label><input type="password" id="password" name="password" minlength="12" required autocomplete="new-password"></div>
      <div class="field"><label for="confirm_password">Repítela</label><input type="password" id="confirm_password" name="confirm_password" minlength="12" required autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit">Guardar</button>
    </form>
  </div>
</div>
{% endblock %}
